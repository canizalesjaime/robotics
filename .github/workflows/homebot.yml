name: homebot CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build frontend
      run: |
        cd robot-dashboard
        npm install
        nohup npm run dev > backend.log 2>&1 &

  
    - name: Pull backend image
      run: docker pull jaimec21/jazzy_pi:latest

    - name: Start backend container
      run: |
        docker run -d \
          --name homebot-backend \
          -v ${{ github.workspace }}/backend:/workspace \
          jaimec21/jazzy_pi:latest \
          tail -f /dev/null

    - name: Build backend
      run: |
        docker exec homebot-backend bash -c "
          cd /workspaces/homebot/ros2_ws
          colcon build
          source install/setup.bash
          "

    - name: Start backend
      run: |
        docker exec -d homebot-backend bash -c "
          cd /workspaces/homebot/ros2_ws
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch robot_control robot_move_launch.py
        "

    # Tests
    - name: Run tests
      run: |
        echo "Run your integration tests here"

    # Cleanup
    # - name: Stop backend container
    #   if: always()
    #   run: |
    #     docker stop homebot-backend
    #     docker rm homebot-backend


